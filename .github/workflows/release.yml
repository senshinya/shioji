name: Release macOS

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    environment: release
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      SHIOJI_UPDATE_PUBLIC_KEY: ${{ vars.SHIOJI_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Swift toolchain and permission bridge
        run: |
          xcodebuild -version
          swift --version
          swift test --package-path native/permission-flow --scratch-path build/native/permission-flow --force-resolved-versions
      - name: Install Codex integration-test dependency
        run: npm install --global @openai/codex@0.167.0
      - name: Resolve and validate release version
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ -z "$RELEASE_TAG" ]]; then
            printf 'RELEASE_TAG=v%s\n' "$version" >> "$GITHUB_ENV"
          else
            test "$RELEASE_TAG" = "v$version"
          fi
      - name: Verify source and target
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$RELEASE_TAG" = "v$(tr -d '\r\n' < VERSION)"
          python3 scripts/verify-design-freeze.py --repository
          python3 scripts/generate-third-party-notices.py --check
          python3 -m unittest discover -s scripts -p 'test_*.py'
          bash scripts/scan-secrets.sh
          go test ./...
          (cd third_party/mygo && go test . ./plugins/updater ./plugins/updater/native)
      - name: Import signing identity and notarization credentials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash packaging/ci-signing.sh
      - name: Build, sign, notarize and package
        env:
          SHIOJI_UPDATE_PRIVATE_KEY: ${{ secrets.SHIOJI_UPDATE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ '${{ github.event_name }}' == release ]]; then
            mkdir -p build/release
            gh release view "$RELEASE_TAG" --json body --jq .body > build/release/release-notes.md
            export SHIOJI_RELEASE_NOTES_FILE="$PWD/build/release/release-notes.md"
          fi
          bash packaging/build-release.sh
      - name: Upload validation DMG
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Shioji-macos-arm64-validation-${{ github.run_id }}
          path: |
            build/release/*.dmg
            build/release/*.dmg.sha256
            build/release/*-darwin-arm64-*.tar.gz
            build/release/update-darwin-arm64.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Attach release assets and publish update manifest last
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/publish-app-update.py --repo "$GH_REPO" --tag "$RELEASE_TAG" --directory build/release
      - name: Remove temporary signing material
        if: always()
        run: |
          if [[ -n "${NOTARY_KEYCHAIN:-}" ]]; then
            security delete-keychain "$NOTARY_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/shioji-certificate.p12"
