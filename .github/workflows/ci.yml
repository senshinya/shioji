name: CI

on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Codex integration-test dependency
        run: npm install --global @openai/codex@0.167.0
      - run: test "$(uname -m)" = arm64
      - run: python3 scripts/verify-design-freeze.py --repository
      - run: python3 scripts/generate-third-party-notices.py --check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: bash scripts/scan-secrets.sh
      - run: go test ./...
      - name: Test native updater admission and preferences
        run: cd third_party/mygo && go test . ./plugins/updater ./plugins/updater/native
      - name: Test native permission bridge
        run: swift test --package-path native/permission-flow --scratch-path build/native/permission-flow -Xswiftc -enable-experimental-feature -Xswiftc IsolatedDeinit
      - name: Build unsigned development bundle
        run: bash packaging/build-dev.sh
