name: CI

on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve Go cache directories
        id: go-cache
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "modules=$(go env GOMODCACHE)"
            echo "arch=$(go env GOARCH)"
          } >> "$GITHUB_OUTPUT"
      - name: Restore rolling Go cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'third_party/**/go.mod', 'third_party/**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'third_party/**/go.mod', 'third_party/**/go.sum') }}-
            setup-go-${{ runner.os }}-${{ steps.go-cache.outputs.arch }}-
      - name: Restore Swift permission bridge cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/native/permission-flow
          key: swift-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('native/permission-flow/**', 'third_party/permissionflow/**', 'scripts/bundle-permission-flow.py') }}
      - name: Install Codex integration-test dependency
        run: npm install --global @openai/codex@0.167.0
      - run: test "$(uname -m)" = arm64
      - name: Test native permission bridge
        run: |
          xcodebuild -version
          swift --version
          swift test --package-path native/permission-flow --scratch-path build/native/permission-flow --force-resolved-versions
      - run: python3 scripts/verify-design-freeze.py --repository
      - run: python3 scripts/generate-third-party-notices.py --check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: bash scripts/scan-secrets.sh
      - run: go test ./...
      - name: Test native updater admission and preferences
        run: cd third_party/mygo && go test . ./plugins/updater ./plugins/updater/native
      - name: Build unsigned development bundle
        run: bash packaging/build-dev.sh
